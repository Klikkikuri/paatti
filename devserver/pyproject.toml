[project]
name = "paatti-devserver"
version = "0.1.0"
description = "Development server for Klikkikuri Paatti: the Ilta-Pulu test news site, local provider manifests, and fault injection"
readme = "README.md"
license = "EUPL-1.2"
authors = [{ name = "Klikkikuri" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.120",
    "uvicorn>=0.38",
    "jinja2>=3.1",
    "faker>=38",
    "suola",
    # `logging` needs the `tracing` extra, and `settings` imports yaml: Klikkikuri/Niitti#3, #4.
    "niitti[all]",
    "pyyaml>=6",
]

[project.scripts]
paatti-devserver = "paatti_devserver.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "hypothesis>=6.140",
    "beautifulsoup4>=4.13",
    "soupsieve>=2.8",
    "html5lib>=1.1",
    "playwright>=1.55",
]

[tool.uv.sources]
# The tag of Paatti's suola submodule. Change both together.
suola = { url = "https://github.com/Klikkikuri/suola/releases/download/v0.7.0/suola-0.7.0-py3-none-any.whl" }
niitti = { git = "https://github.com/Klikkikuri/Niitti", rev = "09333ed0b8498ab8a9149ee60295a6818aff93f0" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/e2e"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
