name: E2E

# The extension e2e suits (Playwright and the Debian chromium, against Ilta-Pulu) do
# not rebuild anything: they run against the artifacts of the Build run that ended,
# so the staged bytes are exactly what every other job of that run saw.
on:
  workflow_run:
    workflows: ["Build"]
    types:
      - completed

permissions:
  contents: read
  actions: read

concurrency:
  group: e2e-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  e2e:
    name: "🧪 Extension E2E"
    # A failed or cancelled Build run has no trustworthy artifacts to test.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Debian, for the same chromium package as the dev container: Ubuntu ships Chromium only as a snap.
    container: node:24-trixie
    env:
      HYPOTHESIS_PROFILE: ci

    steps:
      - name: "🔄 Checkout the Commits that Build ran"
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: "🏷️ Fetch Submodule Tags"
        run: |
          git config --global --add safe.directory '*'
          git -C suola fetch --tags

      - name: "⬇️ Download the Artifacts of that Build Run"
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: true
          path: build

      - name: "🧰 Install Tools"
        run: |
          apt-get update
          apt-get -y install --no-install-recommends chromium jq make python3 zip
          npm install -g jsdom@27

      - name: "📦 Install uv"
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"

      - name: "🧪 Run the Extension E2E"
        run: |
          make test-e2e WASM_FROM_ARTIFACTS=1 DIST_FROM_ARTIFACTS=1
