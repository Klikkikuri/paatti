name: Build

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

# The suola WASM artifacts are built once by the wasm job and handed to every other
# job as the `suola-wasm` artifact (only js.wasm + wasm_exec.js -- never the dist
# tree, whose bytes differ with NON_OSS). The consumers pass WASM_FROM_ARTIFACTS=1
# so make proves the download instead of rebuilding, and `needs: wasm` serializes
# against the artifact upload, not against the flaky checks of the extension job.
jobs:
  wasm:
    name: "🧩 Suola WASM"
    runs-on: ubuntu-latest

    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: "🏗️ Build the WASM Artifacts"
        run: |
          make build-suola

      - name: "⬆️ Upload WASM Artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: suola-wasm
          path: |
            build/js.wasm
            build/wasm_exec.js
          if-no-files-found: error

  extension:
    name: "🛠️ Extension"
    runs-on: ubuntu-latest
    needs: wasm

    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: "🏷️ Fetch Submodule Tags"
        run: |
          git -C suola fetch --tags

      - name: "⬇️ Download WASM Artifacts"
        uses: actions/download-artifact@v8
        with:
          name: suola-wasm
          path: build

      - name: "🏗️ Build Extension Package"
        run: |
          make build NON_OSS=1 WASM_FROM_ARTIFACTS=1

      - name: "🧹 Lint"
        run: |
          npm install -g eslint@10
          make lint

      - name: "🧪 Run Tests"
        run: |
          npm install -g jsdom@27
          make test

      - name: "⬆️ Upload Artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: klikkikuri-paatti-extension
          path: |
            build/klikkikuri-paatti-chrome.zip
            build/klikkikuri-paatti-firefox.zip
          if-no-files-found: error

      - name: "🔍 Check Sites Against the Pinned Rahti Commit"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          make check-sites-published

  devserver:
    name: "🧪 Development Server"
    runs-on: ubuntu-latest
    # Debian, for the same chromium package as the dev container: Ubuntu ships Chromium only as a snap.
    container: node:24-trixie
    needs: wasm
    env:
      HYPOTHESIS_PROFILE: ci

    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: "🏷️ Fetch Submodule Tags"
        run: |
          git config --global --add safe.directory '*'
          git -C suola fetch --tags

      - name: "⬇️ Download WASM Artifacts"
        uses: actions/download-artifact@v8
        with:
          name: suola-wasm
          path: build

      - name: "🧰 Install Tools"
        run: |
          apt-get update
          apt-get -y install --no-install-recommends chromium jq make python3 zip
          npm install -g jsdom@27

      - name: "📦 Install uv"
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"

      - name: "🧪 Test the Development Server and the Extension Against It"
        run: |
          make test-devserver test-e2e WASM_FROM_ARTIFACTS=1
