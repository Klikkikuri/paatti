name: Build

# A feature branch runs this workflow through its pull request only. `push` covers `main`, which has no
# pull request to report on, and `Build` hears no tags: release.yml owns those. A change that touches
# only documentation skips this workflow and Lint both; lint.yml carries the same list, so keep the two
# in step.
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
      - 'LISENSSI*'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
      - 'LISENSSI*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

# The flexible tier: this workflow tests any commit of either submodule on any pull request. A publish
# needs more, and release-checks.yml enforces that on main. docs/release.md, "Submodule Pointers",
# states the rule.
#
# The suola WASM artifacts are produced once by the wasm job and handed to every other job as the
# `suola-wasm` artifact: a tagged pointer downloads the attested suola release, and any other commit
# builds with the Docker wasm builder. A consumer proves the download landed and makes it newer than
# suola's sources, which is what the make rule compares, so make accepts it instead of rebuilding.
# `needs: wasm` waits for the artifact upload only. This job does not wait for the build and test
# steps of the extension job.
jobs:
  wasm:
    name: "🧩 Suola WASM"
    runs-on: ubuntu-latest

    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      # The checkout does not fetch submodule tags, and git describe needs them.
      - name: "🏷️ Fetch Suola Tags"
        run: |
          git -C suola fetch --tags

      # A tagged pointer uses the attested release, which is what ships. Any other commit is built
      # with the Docker wasm builder, so a branch can test suola before its release exists. Main takes
      # only the release path, because a publish must stay possible there.
      - name: "🏷️ Choose the Suola Source"
        id: suola
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRE_RELEASE: ${{ (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        run: |
          if make check-suola-release >/dev/null 2>&1; then
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "suola: released tag $(git -C suola describe --tags --exact-match)" >> "$GITHUB_STEP_SUMMARY"
            echo "The suola pointer is a released tag; the job downloads the attested artifacts."
          elif [ "$REQUIRE_RELEASE" = "true" ]; then
            echo "This event targets main, so the suola pointer must be a released tag."
            make check-suola-release
            exit 1
          else
            echo "mode=build" >> "$GITHUB_OUTPUT"
            echo "suola: built from source at $(git -C suola rev-parse --short HEAD), not a released tag" >> "$GITHUB_STEP_SUMMARY"
            echo "The suola pointer is not a released tag; the job builds it with the Docker wasm builder."
          fi

      - name: "⬇️ Download the Suola Artifacts"
        if: steps.suola.outputs.mode == 'release'
        run: |
          make build-suola USE_RELEASE_ARTIFACTS=1

      - name: "🛡️ Verify the Suola Artifact Attestation"
        if: steps.suola.outputs.mode == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          make verify-suola USE_RELEASE_ARTIFACTS=1

      # CI tests and packages the bytes that this commit produces. A publish never takes this path:
      # check-suola-release stops it without a released tag.
      - name: "🏗️ Build the Suola Artifacts"
        if: steps.suola.outputs.mode == 'build'
        run: |
          make build-suola

      - name: "⬆️ Upload WASM Artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: suola-wasm
          path: |
            build/js.wasm
            build/wasm_exec.js
          if-no-files-found: error

  extension:
    name: "🛠️ Extension"
    runs-on: ubuntu-latest
    needs: wasm

    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: "⬇️ Download WASM Artifacts"
        uses: actions/download-artifact@v8
        with:
          name: suola-wasm
          path: build

      # make accepts the artifact when it is newer than suola's sources, which is what the rule
      # compares; `touch` states that. A truncated download then fails here, in one line, instead of
      # starting a Wasm build that the artifact exists to prevent.
      - name: "🔎 Prove the WASM Artifacts Are Present"
        run: |
          test -s build/js.wasm && test -s build/wasm_exec.js || {
            echo "Error: the suola-wasm artifact did not land in build/."
            exit 1
          }
          touch build/js.wasm build/wasm_exec.js

      - name: "🏗️ Build Extension Package"
        run: |
          make build NON_OSS=1

      - name: "🧹 AMO Lint"
        run: |
          npm install -g web-ext@10
          make lint-webext NON_OSS=1

      - name: "🧪 Run Tests"
        run: |
          npm install -g jsdom@27
          make test

      - name: "⬆️ Upload Artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: klikkikuri-paatti-extension
          path: |
            build/klikkikuri-paatti-chrome.zip
            build/klikkikuri-paatti-firefox.zip
          if-no-files-found: error

      - name: "🔍 Check Sites Against the Pinned Rahti Commit"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          make check-sites-published

  # The development server and the extension e2e share one job: they need the same checkout, the same
  # WASM artifact and the same test image, and a second job would build that image twice.
  # The e2e step runs even when the devserver step fails, so one run reports both suites. Neither check name is
  # required by a branch protection rule, so a single job costs no reporting signal.
  suites:
    name: "🧪 Development Server and Extension E2E"
    runs-on: ubuntu-latest
    needs: wasm

    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      # The artifact zip carries its tree's contents at the root, so js.wasm and wasm_exec.js land
      # in build/ for the make consumers.
      - name: "⬇️ Download the WASM Artifacts"
        uses: actions/download-artifact@v8
        with:
          name: suola-wasm
          path: build

      # make accepts the artifact when it is newer than suola's sources, which is what the rule
      # compares; `touch` states that. A truncated download then fails here, in one line, instead of
      # starting a Docker or TinyGo build in a container that has neither.
      - name: "🔎 Prove the WASM Artifacts Are Present"
        run: |
          test -s build/js.wasm && test -s build/wasm_exec.js || {
            echo "Error: the suola-wasm artifact did not land in build/."
            exit 1
          }
          touch build/js.wasm build/wasm_exec.js

      # The test stage of .devcontainer/Dockerfile: make, python3, chromium and its illustrated
      # dependencies, uv and jsdom. The dev container's final stage builds on this stage, so the job
      # tests the environment a developer uses. The layers come back from the GitHub Actions cache,
      # so a run that does not change the Dockerfile pays a cache download instead of the two apt
      # passes, the chromium and the jsdom install. `mode=max` exports the shim-build stage too,
      # because the chromium layer takes the shim .deb from it. `type=gha` needs the buildx driver;
      # the plain builder has no cache exporters. A cancelled run skips the upload of its cache.
      - name: "🔧 Set Up Docker Buildx"
        uses: docker/setup-buildx-action@v4

      - name: "🐳 Build the Test Image"
        run: |
          docker buildx build --load --target test -t paatti-test \
            --cache-from type=gha --cache-to type=gha,mode=max .devcontainer/

      # The image has no USER, so its default is root: run as the caller, and keep uv's and npm's
      # caches inside the container. The bind mount is the checkout.
      - name: "🧪 Test the Development Server"
        run: |
          docker run --rm -w /app -e UV_LINK_MODE=copy \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e UV_CACHE_DIR=/tmp/uv-cache -e npm_config_cache=/tmp/npm-cache \
            --mount type=bind,src="$PWD",dst=/app \
            paatti-test make test-devserver

      # Playwright and the Debian chromium, against Ilta-Pulu, inside the same image: the environment
      # the dev container runs the e2e with (see Dockerfile). `always()`: a devserver failure must not
      # hide the e2e result, which is the other half of what this job proves.
      - name: "🧪 Run the Extension E2E"
        if: always()
        run: |
          docker run --rm -w /app -e UV_LINK_MODE=copy \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e UV_CACHE_DIR=/tmp/uv-cache -e npm_config_cache=/tmp/npm-cache \
            --mount type=bind,src="$PWD",dst=/app \
            paatti-test make test-e2e
