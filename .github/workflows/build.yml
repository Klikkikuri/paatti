name: Build

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

# The suola WASM artifacts are built once by the wasm job and handed to every other
# job as artifacts: `suola-wasm` carries js.wasm + wasm_exec.js, `extension-dist` an
# OSS extension tree (never NON_OSS bytes -- the zips below are store trees and their
# overlay would change what e2e tests). The consumers pass WASM_FROM_ARTIFACTS=1,
# and the suites job adds DIST_FROM_ARTIFACTS=1, so make proves the downloads
# instead of rebuilding; `needs: wasm` serializes against the artifact uploads,
# not against the flaky checks of the extension job.
jobs:
  wasm:
    name: "🧩 Suola WASM"
    runs-on: ubuntu-latest

    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: "🏗️ Build the WASM Artifacts and the OSS Extension Tree"
        run: |
          make build-suola dist

      - name: "⬆️ Upload WASM Artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: suola-wasm
          path: |
            build/js.wasm
            build/wasm_exec.js
          if-no-files-found: error

      - name: "⬆️ Upload the Extension Tree"
        uses: actions/upload-artifact@v7
        with:
          name: extension-dist
          path: build/dist
          if-no-files-found: error

  extension:
    name: "🛠️ Extension"
    runs-on: ubuntu-latest
    needs: wasm

    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: "🏷️ Fetch Submodule Tags"
        run: |
          git -C suola fetch --tags

      - name: "⬇️ Download WASM Artifacts"
        uses: actions/download-artifact@v8
        with:
          name: suola-wasm
          path: build

      - name: "🏗️ Build Extension Package"
        run: |
          make build NON_OSS=1 WASM_FROM_ARTIFACTS=1

      - name: "🧹 Lint"
        run: |
          npm install -g eslint@10
          make lint

      - name: "🧪 Run Tests"
        run: |
          npm install -g jsdom@27
          make test

      - name: "⬆️ Upload Artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: klikkikuri-paatti-extension
          path: |
            build/klikkikuri-paatti-chrome.zip
            build/klikkikuri-paatti-firefox.zip
          if-no-files-found: error

      - name: "🔍 Check Sites Against the Pinned Rahti Commit"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          make check-sites-published

  # The development server and the extension e2e share one job: they need the same checkout, the same karikko
  # tag guard, the same WASM artifact and the same test image, and a second job would build that image twice.
  # The e2e step runs even when the devserver step fails, so one run reports both suites. Neither check name is
  # required by a branch protection rule, so a single job costs no reporting signal.
  suites:
    name: "🧪 Development Server and Extension E2E"
    runs-on: ubuntu-latest
    needs: wasm

    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: "🏷️ Fetch Submodule Tags"
        run: |
          git -C suola fetch --tags

      # The suites drive karikko from the submodule pointer; an untagged pointer would put unreleased code into a
      # CI test run (plan 3.3). The pointer bump is the release report.
      - name: "🏷️ Karikko pointer is a released tag"
        run: |
          git -C packages/karikko fetch --tags
          git -C packages/karikko describe --tags --exact-match

      # Two explicit, name-scoped downloads: the artifact zips carry their trees' contents at the root, so the
      # extension tree must land *in* build/dist (the artifact root's manifest.json becomes build/dist/
      # manifest.json), while the WASM files drop into build/ for the make consumers.
      - name: "⬇️ Download the WASM Artifacts"
        uses: actions/download-artifact@v8
        with:
          name: suola-wasm
          path: build

      - name: "⬇️ Download the Extension Tree"
        uses: actions/download-artifact@v8
        with:
          name: extension-dist
          path: build/dist

      - name: "🐳 Build the Test Image"
        run: |
          make test-image

      - name: "🧪 Test the Development Server"
        run: |
          make test-image-run CMD="make test-devserver WASM_FROM_ARTIFACTS=1"

      # Playwright and the Debian chromium, against Ilta-Pulu, inside the shared test image: the same environment
      # the dev container runs the e2e with (see Dockerfile). `always()`: a devserver failure must not hide the
      # e2e result, which is the other half of what this job proves.
      - name: "🧪 Run the Extension E2E"
        if: always()
        run: |
          make test-image-run CMD="make test-e2e WASM_FROM_ARTIFACTS=1 DIST_FROM_ARTIFACTS=1"
