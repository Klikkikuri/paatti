name: Build

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: "🛠️ Build"
    runs-on: ubuntu-latest

    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: "🏷️ Fetch Submodule Tags"
        run: |
          git -C suola fetch --tags

      - name: "🏗️ Build Extension Package"
        run: |
          make build NON_OSS=1

      - name: "🧹 Lint"
        run: |
          npm install -g eslint@10
          make lint

      - name: "🧪 Run Tests"
        run: |
          npm install -g jsdom@27
          make test

      - name: "⬆️ Upload Artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: klikkikuri-paatti-extension
          path: |
            build/klikkikuri-paatti-chrome.zip
            build/klikkikuri-paatti-firefox.zip
          if-no-files-found: error

      - name: "🔍 Check Sites Against the Pinned Rahti Commit"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          make check-sites-published

  devserver:
    name: "🧪 Development Server"
    runs-on: ubuntu-latest
    # Debian, for the same chromium package as the dev container: Ubuntu ships Chromium only as a snap.
    container: node:24-trixie
    env:
      HYPOTHESIS_PROFILE: ci

    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: "🏷️ Fetch Submodule Tags"
        run: |
          git config --global --add safe.directory '*'
          git -C suola fetch --tags

      - name: "🧰 Install Tools"
        run: |
          apt-get update
          apt-get -y install --no-install-recommends chromium jq make python3 zip
          npm install -g jsdom@27

      - name: "📦 Install uv"
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.1"

      - name: "🧪 Test the Development Server and the Extension Against It"
        run: |
          make test-devserver test-e2e

