name: Build

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

# The suola WASM artifacts are built once by the wasm job and handed to every other
# job as artifacts: `suola-wasm` carries js.wasm + wasm_exec.js, `extension-dist` an
# OSS extension tree (never NON_OSS bytes -- the zips below are store trees and their
# overlay would change what e2e tests). The consumers pass WASM_FROM_ARTIFACTS=1,
# and the e2e job adds DIST_FROM_ARTIFACTS=1, so make proves the downloads
# instead of rebuilding; `needs: wasm` serializes against the artifact uploads,
# not against the flaky checks of the extension job.
jobs:
  wasm:
    name: "🧩 Suola WASM"
    runs-on: ubuntu-latest

    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: "🏗️ Build the WASM Artifacts and the OSS Extension Tree"
        run: |
          make build-suola dist

      - name: "⬆️ Upload WASM Artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: suola-wasm
          path: |
            build/js.wasm
            build/wasm_exec.js
          if-no-files-found: error

      - name: "⬆️ Upload the Extension Tree"
        uses: actions/upload-artifact@v7
        with:
          name: extension-dist
          path: build/dist
          if-no-files-found: error

  extension:
    name: "🛠️ Extension"
    runs-on: ubuntu-latest
    needs: wasm

    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: "🏷️ Fetch Submodule Tags"
        run: |
          git -C suola fetch --tags

      - name: "⬇️ Download WASM Artifacts"
        uses: actions/download-artifact@v8
        with:
          name: suola-wasm
          path: build

      - name: "🏗️ Build Extension Package"
        run: |
          make build NON_OSS=1 WASM_FROM_ARTIFACTS=1

      - name: "🧹 Lint"
        run: |
          npm install -g eslint@10
          make lint

      - name: "🧪 Run Tests"
        run: |
          npm install -g jsdom@27
          make test

      - name: "⬆️ Upload Artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: klikkikuri-paatti-extension
          path: |
            build/klikkikuri-paatti-chrome.zip
            build/klikkikuri-paatti-firefox.zip
          if-no-files-found: error

      - name: "🔍 Check Sites Against the Pinned Rahti Commit"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          make check-sites-published

  devserver:
    name: "🧪 Development Server"
    runs-on: ubuntu-latest
    needs: wasm

    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: "🏷️ Fetch Submodule Tags"
        run: |
          git -C suola fetch --tags

      - name: "⬇️ Download WASM Artifacts"
        uses: actions/download-artifact@v8
        with:
          name: suola-wasm
          path: build

      - name: "🐳 Build the Test Image"
        run: |
          make test-image

      - name: "🧪 Test the Development Server"
        run: |
          make test-image-run CMD="make test-devserver WASM_FROM_ARTIFACTS=1"

  e2e:
    name: "🧪 Extension E2E"
    runs-on: ubuntu-latest
    needs: wasm

    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: "🏷️ Fetch Submodule Tags"
        run: |
          git -C suola fetch --tags

      # Both artifacts together: js.wasm and wasm_exec.js land in build/, the staged
      # OSS tree in build/dist, and test-e2e proves both instead of rebuilding.
      - name: "⬇️ Download the Build Artifacts"
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: build

      - name: "🐳 Build the Test Image"
        run: |
          make test-image

      # Playwright and the Debian chromium, against Ilta-Pulu, inside the shared test
      # image: the same environment the dev container runs the e2e with (see Dockerfile).
      - name: "🧪 Run the Extension E2E"
        run: |
          make test-image-run CMD="make test-e2e WASM_FROM_ARTIFACTS=1 DIST_FROM_ARTIFACTS=1"
