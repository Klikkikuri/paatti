name: Build

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

# The flexible tier: this workflow tests any commit of either submodule on any branch. A publish needs
# more, and release-checks.yml enforces that on main. docs/release.md, "Submodule Pointers", states the
# rule.
#
# The suola WASM artifacts are produced once by the wasm job and handed to every other job as
# artifacts: a tagged pointer downloads the attested suola release, and any other commit builds with
# the Docker wasm builder. `suola-wasm` carries js.wasm + wasm_exec.js, `extension-dist` an OSS
# extension tree (never NON_OSS bytes -- the zips below are store trees and their overlay would
# change what e2e tests). The consumers pass WASM_FROM_ARTIFACTS=1, and the suites job adds
# DIST_FROM_ARTIFACTS=1, so make proves the downloads instead of rebuilding; `needs: wasm` serializes
# against the artifact uploads, not against the flaky checks of the extension job.
jobs:
  wasm:
    name: "🧩 Suola WASM"
    runs-on: ubuntu-latest

    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      # The checkout does not fetch submodule tags, and git describe needs them.
      - name: "🏷️ Fetch Suola Tags"
        run: |
          git -C suola fetch --tags

      # A tagged pointer uses the attested release, which is what ships. Any other commit is built
      # with the Docker wasm builder, so a branch can test suola before its release exists. Main takes
      # only the release path, because a publish must stay possible there.
      - name: "🏷️ Choose the Suola Source"
        id: suola
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRE_RELEASE: ${{ (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        run: |
          if make check-suola-release >/dev/null 2>&1; then
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "suola: released tag $(git -C suola describe --tags --exact-match)" >> "$GITHUB_STEP_SUMMARY"
            echo "The suola pointer is a released tag; the job downloads the attested artifacts."
          elif [ "$REQUIRE_RELEASE" = "true" ]; then
            echo "This event targets main, so the suola pointer must be a released tag."
            make check-suola-release
            exit 1
          else
            echo "mode=build" >> "$GITHUB_OUTPUT"
            echo "suola: built from source at $(git -C suola rev-parse --short HEAD), not a released tag" >> "$GITHUB_STEP_SUMMARY"
            echo "The suola pointer is not a released tag; the job builds it with the Docker wasm builder."
          fi

      - name: "⬇️ Download the Suola Artifacts and Stage the Extension Tree"
        if: steps.suola.outputs.mode == 'release'
        run: |
          make dist USE_RELEASE_ARTIFACTS=1

      - name: "🛡️ Verify the Suola Artifact Attestation"
        if: steps.suola.outputs.mode == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          make verify-suola USE_RELEASE_ARTIFACTS=1

      # CI tests and packages the bytes that this commit produces. A publish never takes this path:
      # check-suola-release stops it without a released tag.
      - name: "🏗️ Build the Suola Artifacts and Stage the Extension Tree"
        if: steps.suola.outputs.mode == 'build'
        run: |
          make dist

      - name: "⬆️ Upload WASM Artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: suola-wasm
          path: |
            build/js.wasm
            build/wasm_exec.js
          if-no-files-found: error

      - name: "⬆️ Upload the Extension Tree"
        uses: actions/upload-artifact@v7
        with:
          name: extension-dist
          path: build/dist
          if-no-files-found: error

  extension:
    name: "🛠️ Extension"
    runs-on: ubuntu-latest
    needs: wasm

    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: "⬇️ Download WASM Artifacts"
        uses: actions/download-artifact@v8
        with:
          name: suola-wasm
          path: build

      - name: "🏗️ Build Extension Package"
        run: |
          make build NON_OSS=1 WASM_FROM_ARTIFACTS=1

      - name: "🧹 Lint"
        run: |
          npm install -g eslint@10
          make lint

      - name: "🧪 Run Tests"
        run: |
          npm install -g jsdom@27
          make test

      - name: "⬆️ Upload Artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: klikkikuri-paatti-extension
          path: |
            build/klikkikuri-paatti-chrome.zip
            build/klikkikuri-paatti-firefox.zip
          if-no-files-found: error

      - name: "🔍 Check Sites Against the Pinned Rahti Commit"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          make check-sites-published

  # The development server and the extension e2e share one job: they need the same checkout, the same
  # WASM artifact and the same test image, and a second job would build that image twice.
  # The e2e step runs even when the devserver step fails, so one run reports both suites. Neither check name is
  # required by a branch protection rule, so a single job costs no reporting signal.
  suites:
    name: "🧪 Development Server and Extension E2E"
    runs-on: ubuntu-latest
    needs: wasm

    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      # Two explicit, name-scoped downloads: the artifact zips carry their trees' contents at the root, so the
      # extension tree must land *in* build/dist (the artifact root's manifest.json becomes build/dist/
      # manifest.json), while the WASM files drop into build/ for the make consumers.
      - name: "⬇️ Download the WASM Artifacts"
        uses: actions/download-artifact@v8
        with:
          name: suola-wasm
          path: build

      - name: "⬇️ Download the Extension Tree"
        uses: actions/download-artifact@v8
        with:
          name: extension-dist
          path: build/dist

      - name: "🐳 Build the Test Image"
        run: |
          make test-image

      - name: "🧪 Test the Development Server"
        run: |
          make test-image-run CMD="make test-devserver WASM_FROM_ARTIFACTS=1"

      # Playwright and the Debian chromium, against Ilta-Pulu, inside the shared test image: the same environment
      # the dev container runs the e2e with (see Dockerfile). `always()`: a devserver failure must not hide the
      # e2e result, which is the other half of what this job proves.
      - name: "🧪 Run the Extension E2E"
        if: always()
        run: |
          make test-image-run CMD="make test-e2e WASM_FROM_ARTIFACTS=1 DIST_FROM_ARTIFACTS=1"
