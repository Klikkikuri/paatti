name: Publish to Chrome Web Store

# Run by hand from the Actions tab with a release tag selected as the ref. Uploads the store build
# of that tag to the Chrome Web Store and submits it for review; see docs/release.md.
on:
  workflow_dispatch:
    inputs:
      store_revision:
        description: "Fourth version component of the store build (bump after a rejection)"
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: "🛍️ Submit to the Chrome Web Store"
    runs-on: ubuntu-latest

    steps:
      - name: "🏷️ Require a release tag"
        run: |
          [[ "$GITHUB_REF" == refs/tags/v* ]] && exit 0
          echo "Error: run this workflow on a v* tag, not on $GITHUB_REF"
          exit 1

      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: "🏷️ Fetch Submodule Tags"
        run: |
          git -C suola fetch --tags

      - name: "🔧 Set up Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: "🔧 Install chrome-webstore-upload-cli"
        run: |
          npm install -g chrome-webstore-upload-cli@4

      - name: "🚀 Build, verify and submit"
        env:
          STORE_REVISION: ${{ inputs.store_revision }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: |
          make publish-chrome STORE_REVISION="$STORE_REVISION"
