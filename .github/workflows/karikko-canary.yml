name: Karikko canary
# The released-plan check: karikko `main` against Paatti's own tooling, on a schedule. Runs what the
# karikko repository's release does NOT: the pointer/runner path of `make test-devserver` (a jsom-free flow:
# no browser, no container inside this one).
#
# Failures open an issue on the repository; the scheduled runs of this task do not block Paatti's releases.

on:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * 1" # Mondays 4:40 UTC

permissions:
  contents: read

jobs:
  canary:
    name: "🧪 Build karikko from `main` and run the drift runner"
    runs-on: ubuntu-latest
    steps:
      - name: "🔄 Checkout Paatti (the runner need only make)"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Derived from the same steps as the release workflow's (build → run), against `main` this time —
      # not docker/build-push; the e2e doesn't wrap, and the runner images inside it are in the workflow's
      # own container.
      - name: "⬇️ Fetch karikko `main`"
        uses: actions/checkout@v4
        with:
          repository: Karikko/karikko
          ref: main
          path: karikko

      # The e2e needs the karikko module paths: the test-image and profile directories mount the workspace,
      # and the run must be from the checkout, so the same Chrome and the sqlite backend...
      - name: "🐍 Test the kariko checkout"
        run: |
          make test-devserver KARIKKO_DIR="$PWD/karikko"
