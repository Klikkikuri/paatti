<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="popupPageTitle">Klikkikuri Paatti</title>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="components.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- POWER -->
    <div id="power">
        <div style="display: flex; flex-direction: column; align-items: flex-start; text-align: left; gap: 2px;">
            <h2 id="site-host" style="margin: 0; line-height: 1.2; text-align: left;"></h2>
            <div id="active-tab-indicator" class="text-muted-small" style="font-weight: bold; opacity: 0.8; text-transform: uppercase; font-size: 0.7em; letter-spacing: 0.05em; text-align: left;"></div>
        </div>
        <div>
            <compact-button id="open-options" icon="images/icon_gear.svg" alt="Settings icon" data-i18n-alt="iconSettingsAlt" data-i18n-title="navigationSettingsLabel"></compact-button>
            <power-button></power-button>
        </div>
    </div>

    <!-- CONTENT -->
    <div class="content main-content" data-view="main">
        <page-background></page-background>
        <div id="homeview-content" style="display: flex; flex-direction: column; gap: 15px; width: 100%; text-align: center; justify-content: center; align-items: center; height: 100%;">
            <p id="homeview-status-text"></p>
            <div id="gauge-container" class="hidden">
                <svg viewBox="0 0 100 60">
                    <defs>
                        <linearGradient id="gauge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="var(--severity-1)" />
                            <stop offset="35%" stop-color="var(--severity-2)" />
                            <stop offset="65%" stop-color="var(--severity-3)" />
                            <stop offset="100%" stop-color="var(--severity-4)" />
                        </linearGradient>
                    </defs>
                    <path d="M 15 50 A 35 35 0 0 1 85 50" fill="none" stroke="var(--color-border-subtle)" stroke-width="8" stroke-linecap="round"/>
                    <path id="gauge-fill" d="M 15 50 A 35 35 0 0 1 85 50" fill="none" stroke="url(#gauge-grad)" stroke-width="8" stroke-linecap="round"
                          stroke-dasharray="110" stroke-dashoffset="110" style="transition: stroke-dashoffset 1.0s cubic-bezier(0.4, 0, 0.2, 1);"/>
                    <text id="gauge-text" x="50" y="45" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="var(--color-text-primary)">0%</text>
                    <text id="gauge-label" x="50" y="58" font-family="Arial, sans-serif" font-size="5.5" font-weight="bold" text-anchor="middle" fill="var(--color-text-secondary)"></text>
                </svg>
                <dl id="homeview-page-stats-list" class="stats-list"></dl>
            </div>
            <button id="request-site-btn" class="push-button hidden" style="margin: 0; font-size: 0.9em; padding: 6px 12px; min-height: 32px;"></button>
            <database-status-setting id="homeview-db-status" layout="compact" class="hidden" style="width: 100%;"></database-status-setting>
            <div class="companion hidden" aria-hidden="true"></div>
        </div>
    </div>

    <!-- STATS VIEW -->
    <div class="content statsview hidden" data-view="stats">
        <div id="statsview">
            <h2 class="statsview-eyebrow">
                <span id="statsview-collecting-period" class="hidden"></span>
            </h2>
            <div id="statsview-body">
                <div class="statsview-total statsview-panel">
                    <p class="statsview-headline">
                        <span id="statsview-converted-count" class="statsview-headline-number"></span>
                        <span id="statsview-converted-of" class="statsview-headline-of hidden"></span>
                    </p>
                    <p class="statsview-headline-label"
                       data-i18n="statsviewGroupedByClickbaitinessLabelTotal"></p>
                </div>
                <p class="statsview-note" data-i18n="statsviewBreakdownCaption"></p>
                <dl id="statistics-grouped-by-clickbaitiness" class="stats-list statsview-panel"></dl>
            </div>
            <p id="statsview-empty" class="statsview-empty hidden"></p>
        </div>
    </div>

    <div class="content feedbackview hidden" data-view="feedback">
        <div id="feedbackview-conversions-container" style="display: flex; flex-direction: column; gap: 10px; width: 100%;">
            <p id="feedbackview-no-conversions" style="text-align: center; color: var(--color-text-secondary); font-style: italic;" class="hidden"></p>
            <ul id="feedbackview-conversions-list" style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px; width: 100%;"></ul>
        </div>

    </div>

    <div class="content settingsview hidden" data-view="settings">
        <h2 id="settingsview-status-title" class="settingsview-header"></h2>
        <hr>
        <master-switch-setting layout="compact"></master-switch-setting>

        <h2 id="settingsview-clickbait-level-title" class="settingsview-header"></h2>
        <hr>
        <clickbait-level-horizontal></clickbait-level-horizontal>

        <h2 id="settingsview-sites-enabled-title" class="settingsview-header"></h2>
        <hr>
        <ul id="sites-enabled-ul">
        </ul>

        <h2 id="settingsview-database-status-title" class="settingsview-header"></h2>
        <hr>
        <database-status-setting layout="compact"></database-status-setting>

        <!-- More settings button -->
        <hr>
        <div style="margin-top: 15px; text-align: center; width: 100%;">
            <button id="open-options-btn" class="push-button" style="width: 100%; padding: 8px 16px; font-size: 0.9em; min-height: 36px;"></button>
        </div>

        <!-- devmode (development-only; see docs/PRIVACY_POLICY_DEVELOPMENT.md): the settings of the
             Development environment. The capture row is wired by src/options/dev-capture.js; a store
             install has no loopback provider, so the rows stay hidden. -->
        <div class="devmode hidden" style="margin-top: 15px;">
            <h2 id="settingsview-devmode-title" class="settingsview-header"></h2>
            <hr>
            <ul style="list-style: none; padding: 0; margin-top: 10px; display: flex; flex-direction: column; gap: 12px; width: 100%;">
                <li id="devmode-capture" class="hidden" style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px; width: 100%;">
                    <span style="font-weight: bold;" data-i18n="devmodeCaptureLabel"></span>
                    <button id="devmode-capture-button" class="push-button" style="margin: 0; padding: 6px 12px; min-height: 32px; font-size: 0.9em;" data-i18n="devmodeCaptureBtn"></button>
                    <span id="devmode-capture-status" role="status" style="width: 100%; font-size: 0.9em;"></span>
                </li>
                <visual-highlight-setting layout="compact"></visual-highlight-setting>
            </ul>
        </div>
    </div>

    <!-- NAVI[GATION] -->
    <div id="navi">
        <input  id="open-home" type="radio" name="navi" value="open-home" checked>
        <label for="open-home" class="navi-option">
            <img class="navi-icon icon" src="images/icon_home.svg" height="15" alt="Home icon" data-i18n-alt="iconHomeAlt">
        </label>
        <input  id="open-feedbackview" type="radio" name="navi" value="open-feedbackview">
        <label for="open-feedbackview" class="navi-option">
            <img class="navi-icon icon" src="images/icon_comment.svg" height="15" alt="Comment icon" data-i18n-alt="iconFeedbackAlt">
        </label>
        <input  id="open-statsview" type="radio" name="navi" value="open-statsview">
        <label for="open-statsview" class="navi-option">
            <img class="navi-icon icon" src="images/icon_chart.svg" height="15" alt="Stats icon" data-i18n-alt="iconStatsAlt">
        </label>
        <input  id="open-settingsview" type="radio" name="navi" value="open-settingsview">
        <label for="open-settingsview" class="navi-option">
            <img class="navi-icon icon" src="images/icon_slider.svg" height="15" alt="Slider icon" data-i18n-alt="iconSettingsAlt">
        </label>
    </div>

    <!-- LOGO -->
    <div id="logo">
        <span data-i18n="logoMadeWith">Made with</span>
        <span id="logo-graphics">
            <input class="hidden" id="enable-devmode">
            <label for="enable-devmode">
                <img src="images/klikkihAI_logo_1.png" height="15" alt="Klikkikuri logo" data-i18n-alt="iconLogoAlt">
                <span class="devmode hidden">🤓</span>
            </label>
        </span>
        <span data-i18n="logoByKlikkikuri">by Klikkikuri</span>
    </div>

    <script type="module" src="../utils.js"></script>
    <script type="module" src="../model.js"></script>
    <script type="module" src="popup.js"></script>
    <script type="module" src="../controller.js"></script>
</body>

</html>
